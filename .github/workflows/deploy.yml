# Deploy the static dashboard to GitHub Pages on every push to main.
# This repo contains ONLY the dashboard (no statement PDFs or parsed data),
# so the whole repo root is published as the site.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # allow manual runs from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# One concurrent deploy; cancel older in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "." # repo root = the static site
      - id: deployment
        uses: actions/deploy-pages@v4
